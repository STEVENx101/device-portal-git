name: Deploy Portal to New Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on:
      - self-hosted
      - Linux
      - int-din-new

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build WAR Package
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Stop Tomcat
        run: |
          systemctl stop tomcat-deviceportal

      - name: Deploy WAR
        run: |
          rm -rf /var/www/tomcat-deviceportal/webapps/portal
          rm -f /var/www/tomcat-deviceportal/webapps/portal.war
          cp target/portal.war /var/www/tomcat-deviceportal/webapps/portal.war

      - name: Start Tomcat
        run: |
          systemctl start tomcat-deviceportal