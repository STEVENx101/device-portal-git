name: Deploy Portal to Tomcat

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR Package
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Deploy to Tomcat
        run: |
          cp target/portal.war /opt/tomcat10/webapps/
